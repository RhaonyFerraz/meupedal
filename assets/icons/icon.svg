<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16171b"/>
      <stop offset="50%" stop-color="#0e0f12"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7338"/>
      <stop offset="50%" stop-color="#fc4c02"/>
      <stop offset="100%" stop-color="#d33600"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="506" height="506" x="3" y="3" rx="107" fill="none" stroke="#262832" stroke-width="6"/>

  <!-- Subtle Speed Track Arc -->
  <path d="M 90 380 A 180 180 0 0 1 422 380" fill="none" stroke="#222530" stroke-width="12" stroke-linecap="round"/>
  <path d="M 120 380 A 180 180 0 0 1 380 200" fill="none" stroke="url(#orangeGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Modern Bike / Cyclist Icon -->
  <g transform="translate(10, -5)">
    <!-- Back Wheel -->
    <circle cx="160" cy="320" r="64" fill="none" stroke="#4a4d5a" stroke-width="10"/>
    <circle cx="160" cy="320" r="54" fill="none" stroke="url(#orangeGrad)" stroke-width="6" opacity="0.8"/>
    <circle cx="160" cy="320" r="10" fill="#fc4c02"/>

    <!-- Front Wheel -->
    <circle cx="340" cy="320" r="64" fill="none" stroke="#4a4d5a" stroke-width="10"/>
    <circle cx="340" cy="320" r="54" fill="none" stroke="url(#orangeGrad)" stroke-width="6" opacity="0.8"/>
    <circle cx="340" cy="320" r="10" fill="#fc4c02"/>

    <!-- Bike Frame Structure -->
    <!-- Bottom Bracket (Central Pivot) -->
    <circle cx="235" cy="320" r="12" fill="#fff"/>

    <!-- Chainstay: Back wheel to BB -->
    <line x1="160" y1="320" x2="235" y2="320" stroke="#ff834f" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Seatstay: Back wheel to saddle junction -->
    <line x1="160" y1="320" x2="215" y2="230" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
    
    <!-- Seat tube: BB to saddle -->
    <line x1="235" y1="320" x2="215" y2="215" stroke="url(#orangeGrad)" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Down tube: BB to head tube -->
    <line x1="235" y1="320" x2="310" y2="215" stroke="#ffffff" stroke-width="11" stroke-linecap="round"/>

    <!-- Top tube: saddle junction to head tube -->
    <line x1="215" y1="230" x2="305" y2="225" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>

    <!-- Fork: Head tube to front wheel -->
    <line x1="312" y1="205" x2="340" y2="320" stroke="url(#orangeGrad)" stroke-width="10" stroke-linecap="round"/>

    <!-- Handlebars and Stem -->
    <path d="M 312 205 L 325 185 L 348 190" fill="none" stroke="#00e5ff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Saddle -->
    <path d="M 195 212 L 235 210" stroke="#00e5ff" stroke-width="10" stroke-linecap="round"/>

    <!-- Dynamic Cyclist Silhouette -->
    <!-- Head/Helmet -->
    <circle cx="280" cy="140" r="22" fill="#fc4c02" filter="url(#glow)"/>
    <ellipse cx="285" cy="136" rx="26" ry="12" fill="#ff7a45" transform="rotate(-18 285 136)"/>

    <!-- Cyclist Torso / Back -->
    <path d="M 270 155 Q 235 185 218 220" fill="none" stroke="#fc4c02" stroke-width="18" stroke-linecap="round"/>

    <!-- Arm reaching handlebars -->
    <path d="M 255 175 L 305 185 L 335 188" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Leg pedaling -->
    <path d="M 220 220 L 252 260 L 235 310" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- GPS Signal Pulse at Top Corner -->
  <g transform="translate(395, 75)">
    <circle cx="0" cy="0" r="8" fill="#00e676"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#00e676" stroke-width="3" opacity="0.8"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#00e676" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Brand Name Accent -->
  <text x="256" y="445" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="4">MEU<tspan fill="#fc4c02">PEDAL</tspan></text>
</svg>
